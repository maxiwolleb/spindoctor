name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege, plus the two scopes the Pages deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys; never cancel a publish that's already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.34.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build docs site
        run: pnpm --filter @spindoctor/website docs:build
        env:
          # Project site is served under /spindoctor/, not the domain root.
          DOCS_BASE: /spindoctor/

      # Coverage is measured here, not just in CI, because this is the workflow
      # that publishes to Pages — and the badge below is served from the site
      # itself, which keeps the number in lockstep with what is on main without
      # needing a third-party coverage service or any token. Costs one extra
      # test run per docs deploy.
      - name: Measure coverage for the README badge
        run: pnpm test:coverage

      - name: Publish the coverage badge endpoint
        run: |
          node -e '
            const fs = require("node:fs");
            const pct = require("./coverage/coverage-summary.json").total.lines.pct;
            const color =
              pct >= 90 ? "brightgreen" : pct >= 80 ? "green" : pct >= 70 ? "yellow" : "orange";
            fs.writeFileSync(
              "website/.vitepress/dist/coverage.json",
              JSON.stringify({ schemaVersion: 1, label: "coverage", message: pct.toFixed(1) + "%", color }),
            );
          '

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
