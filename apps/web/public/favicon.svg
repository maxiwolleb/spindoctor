<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-labelledby="title">
  <title id="title">spindoctor favicon</title>
  <defs>
    <filter id="pulse-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="80" height="80" rx="18" fill="#0F1613"/>
  <circle cx="40" cy="40" r="26" fill="none" stroke="#2A3A32" stroke-width="5"/>
  <polyline points="20,40 34,40 39,28 45,52 50,40 60,40" fill="none"
    stroke="#38F5A2" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"
    filter="url(#pulse-glow)"/>
</svg>
