<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-labelledby="title">
  <title id="title">spindoctor Pulse Ring mark</title>
  <defs>
    <filter id="pulse-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <circle cx="40" cy="40" r="29" fill="none" stroke="#22332B" stroke-width="2.5"/>
  <circle cx="40" cy="40" r="18" fill="none" stroke="#22332B" stroke-width="1.5" opacity=".7"/>
  <polyline points="12,40 27,40 32,40 36,25 41,55 45,40 53,40 68,40" fill="none"
    stroke="#38F5A2" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round"
    filter="url(#pulse-glow)"/>
</svg>
